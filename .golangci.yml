version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
  exclusions:
    rules:
      # A failed Close after a successful read is not actionable.
      - linters: [errcheck]
        source: 'defer .*\.Close\(\)'

      - path: _test\.go
        linters: [gosec, noctx]
      # Dev-only helper servers, never exposed.
      - path: cmd/fake
        linters: [gosec]

formatters:
  enable:
    - gofmt
