name: Set up linuxdeploy
description: Installs linuxdeploy and its AppImage plugin, which bundle the libraries the Linux app needs into an AppImage.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        github=https://github.com/linuxdeploy
        mkdir -p "$HOME/bin"
        curl -fsSL -o "$HOME/bin/linuxdeploy" \
          "$github/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        # The AppImage plugin is a separate project with its own releases.
        curl -fsSL -o "$HOME/bin/linuxdeploy-plugin-appimage" \
          "$github/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
        chmod +x "$HOME/bin/"*
        echo "$HOME/bin" >> "$GITHUB_PATH"
