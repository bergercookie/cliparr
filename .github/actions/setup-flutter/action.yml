name: Set up Flutter
description: Installs the Flutter version pinned in .flutter-version, plus Java and the Linux desktop build dependencies.

runs:
  using: composite
  steps:
    - id: flutter
      shell: bash
      run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.flutter.outputs.version }}
        channel: stable
        cache: true
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libfuse2 dpkg-dev
