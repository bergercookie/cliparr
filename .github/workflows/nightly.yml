name: Nightly

# Builds a prerelease every night if master changed since the last one.
# Run it manually from the Actions tab to build one right now.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - id: plan
        run: |
          # Manual runs always build; scheduled runs only when something changed.
          # Plain `just`, not devbox: devbox prints its own messages, which would
          # end up inside the value written to $GITHUB_OUTPUT.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || just nightly-needed; then
            version="$(just nightly-version)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.post[0-9]+\.[0-9]{8}$ ]]; then
              echo "::error::Unexpected nightly version: $version"
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No changes since the last nightly, skipping."
          fi

  nightly:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      kind: prerelease
    permissions:
      contents: write
      packages: write
    secrets: inherit

  prune:
    needs: nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just nightly-prune 14
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
