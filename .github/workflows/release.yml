name: Release

# Push a tag like v1.2.3 to publish a release: GitHub release with .deb,
# AppImage and .apk, plus the Docker images on ghcr.io.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.strip.outputs.version }}
    steps:
      - id: strip
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      kind: stable
    permissions:
      contents: write
      packages: write
    secrets: inherit
