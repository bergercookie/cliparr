name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only calls `just`; see the justfile for what each recipe does.
jobs:
  # The lint and test jobs run in devbox but with the Flutter version pinned in
  # .flutter-version put first on the PATH: devbox's own Flutter can be a patch
  # release behind, and would rewrite pubspec.lock.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          full: "false"
      - uses: jetify-com/devbox-install-action@v0.15.0
      - run: |
          # shellcheck disable=SC2016  # $PATH must expand inside devbox, where it holds devbox's tools
          devbox run -- sh -c 'PATH="$FLUTTER_ROOT/bin:$PATH" just lint'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          full: "false"
      - uses: jetify-com/devbox-install-action@v0.15.0
      - run: |
          # shellcheck disable=SC2016  # $PATH must expand inside devbox, where it holds devbox's tools
          devbox run -- sh -c 'PATH="$FLUTTER_ROOT/bin:$PATH" just test'
      - run: devbox run -- just coverage
      # Pull request comment and README badge come from Codecov. Needs the
      # CODECOV_TOKEN secret (see docs/development.md); without it the upload is skipped.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/server.out
          flags: server
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/app.lcov
          flags: app
          fail_ci_if_error: false

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.15.0
      - run: devbox run -- just vuln

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.15.0
      - run: devbox run -- just e2e

  # Runs on the plain runner, not in devbox: the browser test needs Python
  # packages with native libraries, which Nix's Python cannot load.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - uses: extractions/setup-just@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: just lint-extension
      - run: just e2e-extension

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.15.0
      - run: devbox run -- just docs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.15.0
      - run: devbox run -- just docker-build

  # Installs an old build on an Android emulator and updates it to a newer one,
  # as a user would. Catches signing and version mistakes before a release.
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - uses: extractions/setup-just@v4
      - run: just upgrade-apks
      - run: just upgrade-static
      - uses: ./.github/actions/emulator
        with:
          script: just upgrade-check

  # Builds the real release packages so a broken release is caught before tagging.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - uses: extractions/setup-just@v4
      - uses: ./.github/actions/setup-linuxdeploy
      - run: just package-apk 0.0.0
      - run: just package-linux 0.0.0
